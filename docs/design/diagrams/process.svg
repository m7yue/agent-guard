<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
  <title id="title">AgentGuard 进程模型</title>
  <desc id="desc">渲染层通过 preload IPC 访问主进程，主进程与独立执行器通信，执行器写入 SQLite，主进程只读。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/></marker>
    <style>
      .bg{fill:#ffffff}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:1.5}
      .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:600;fill:#0f1720}
      .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#64748b}
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;fill:#334155}
      .legend{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;fill:#64748b}
      .line{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .line-dash{stroke:#475569;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .event{stroke:#c2410c;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect class="bg" width="1040" height="480"/>

  <g>
    <rect class="box" x="40" y="170" width="220" height="110" rx="12"/>
    <rect x="40" y="170" width="5" height="110" fill="#c2410c"/>
    <text class="title" x="64" y="205">Renderer</text>
    <text class="sub" x="64" y="230">React UI</text>
    <text class="sub" x="64" y="252">不接触 Node</text>
  </g>

  <g>
    <rect class="box" x="360" y="170" width="230" height="110" rx="12"/>
    <rect x="360" y="170" width="5" height="110" fill="#c2410c"/>
    <text class="title" x="384" y="205">Main</text>
    <text class="sub" x="384" y="230">窗口 / 托盘 / 审批裁决</text>
    <text class="sub" x="384" y="252">IPC 契约入口</text>
  </g>

  <g>
    <rect class="box" x="710" y="170" width="250" height="110" rx="12"/>
    <rect x="710" y="170" width="5" height="110" fill="#c2410c"/>
    <text class="title" x="734" y="205">Executor</text>
    <text class="sub" x="734" y="230">utilityProcess</text>
    <text class="sub" x="734" y="252">Agent loop / tools</text>
  </g>

  <g>
    <path d="M390 380 v48 a115 18 0 0 0 230 0 v-48" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="505" cy="380" rx="115" ry="18" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <text class="title" x="456" y="420">SQLite</text>
    <text class="sub" x="435" y="442">会话 / 运行 / 事件 / 记忆</text>
  </g>

  <path class="line" d="M260 200 H350"/>
  <text class="label" x="265" y="185">zod IPC via preload</text>

  <path class="line" d="M590 200 H700"/>
  <text class="label" x="595" y="185">executor protocol</text>

  <path class="line" d="M710 250 H600"/>
  <text class="label" x="615" y="278">agent events / approval request</text>

  <path class="line" d="M360 250 H270"/>
  <text class="label" x="275" y="278">push events</text>

  <path class="line-dash" d="M475 280 V355"/>
  <text class="label" x="490" y="330">read-only</text>

  <path class="line" d="M830 280 V430 H630"/>
  <text class="label" x="735" y="452">write</text>

  <text class="legend" x="40" y="465">实线：调用 / 写入　虚线：事件 / 只读</text>
</svg>
