# electron-builder 配置：生成仅用于本地验证的 macOS 应用，不对外分发。
#
# 文件名是约定：builder 会自动找 electron-builder.yml / .json / .js，
# 也支持写在 package.json 的 build 字段里。
#
# 字段按重要性分三档：
#   [概念] 换项目也要懂：files、asar/asarUnpack、target、identity
#   [参数] 本项目取值：output、arch、category
#   [环境] 因为环境限制：electronDist、npmRebuild（见文件末尾说明）
#
# 三个关键点：
# 1. better-sqlite3 是原生模块，必须从 asar 里解出来（asarUnpack），否则运行时 require 失败；
# 2. 复用本地 electron（electronDist），打包时不再下载一份 Electron；
# 3. 本阶段不做正式签名（identity: null）——没有 Apple 开发者账号，
#    产物只在本机做打包/启动验证，不发布、不分发。
appId: com.agentguard.app
productName: AgentGuard

directories:
  output: dist
  buildResources: resources

# 进包的内容：构建产物 + 托盘图标 + package.json（main 指向 out/main/index.js）
files:
  - out/**
  - resources/**
  - package.json

# asar 把源码打成一个包；原生模块必须解包到 app.asar.unpacked
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**

# 原生模块已经用 electron-rebuild 重建过，这里不要再让 builder 重新编译
npmRebuild: false

# 用仓库里已安装的 Electron，避免打包阶段联网下载
electronDist: node_modules/electron/dist

# [概念] 本地验证目标：只生成 dmg，用于本机安装/启动验证；不发布、不生成更新包
mac:
  target:
    - target: dmg
      arch:
        - arm64
  # [参数] Finder / Launchpad 里的分类
  category: public.app-category.developer-tools
  # [概念+临时] 签名身份。null = 跳过签名；生产应填 Developer ID，并配合公证
  identity: null
  # [概念] 运行时加固（禁止注入动态库等），是公证的前提；无正式签名时开着也没用
  hardenedRuntime: false

dmg:
  writeUpdateInfo: false

# 本项目不配置公开更新源，也不发布安装包。
# 自动更新链路仅保留代码层面的工程实现，不作为公开分发能力开放。
